<!-- User Activity Panel -->
<div class="users-container" role="region" aria-label="User activity monitor">
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i class="fas fa-users"></i>
                <span>User Activity Monitor</span>
            </div>
            <div class="card-subtitle">
                Active user sessions and resource consumption
            </div>
        </div>
        <div class="card-body">
            <!-- Search and Filter Controls -->
            <div class="table-controls" role="search">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text"
                           id="user-search"
                           placeholder="Search users..."
                           aria-label="Search users by name or server">
                </div>

                <div class="filter-group">
                    <label for="server-filter">Server:</label>
                    <select id="server-filter" aria-label="Filter by server">
                        <option value="">All Servers</option>
                    </select>
                </div>

                <div class="sort-group">
                    <label for="sort-by">Sort:</label>
                    <select id="sort-by" aria-label="Sort users by field">
                        <option value="cpu">CPU Usage</option>
                        <option value="mem">Memory Usage</option>
                        <option value="disk">Disk Usage</option>
                        <option value="username">Username</option>
                    </select>
                </div>
            </div>

            <!-- Users Table -->
            <div class="table-wrapper" role="region" aria-label="User data table" tabindex="0">
                <table id="users-table" class="data-table" aria-label="User activity data">
                    <thead>
                        <tr>
                            <th scope="col">Server</th>
                            <th scope="col">Username</th>
                            <th scope="col">Full Name</th>
                            <th scope="col">CPU %</th>
                            <th scope="col">Memory %</th>
                            <th scope="col">Disk GB</th>
                            <th scope="col">Processes</th>
                            <th scope="col">Top Process</th>
                            <th scope="col">Last Login</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="9" class="text-center" style="padding: 2rem;">
                                <div class="spinner" style="margin: 0 auto;"></div>
                                <p style="margin-top: 0.5rem; color: var(--text-secondary);">Loading user data...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="users-pagination" role="navigation" aria-label="Table pagination">
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('users-panel').classList.contains('active')) {
        loadUserActivity();
    }
});
document.querySelector('[data-tab="users"]')?.addEventListener('click', function() {
    loadUserActivity();
});
</script>
