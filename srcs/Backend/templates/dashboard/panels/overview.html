<!-- Usage Overview Panel: one-screen status board -->
<section class="overview-container" role="region" aria-labelledby="overview-heading">
    <header class="section-head board-head">
        <div>
            <p class="kicker">Section 01</p>
            <h2 id="overview-heading">Usage Overview</h2>
        </div>
        <p class="board-summary" id="overview-lede" aria-live="polite"></p>
    </header>

    <div class="board">
        <!-- Fleet: every server, most free capacity first (top row = best place for a new job) -->
        <section class="board-panel board-fleet" aria-labelledby="fleet-heading">
            <header class="board-panel-head">
                <h3 id="fleet-heading">Fleet</h3>
                <span class="board-note">Most free capacity first · <span class="best-star" aria-hidden="true">★</span> best place for a new job</span>
            </header>
            <div class="table-wrapper">
                <table class="data-table fleet-table">
                    <thead>
                        <tr>
                            <th scope="col">Server</th>
                            <th scope="col" title="Bar: share of logical CPUs in use (5-minute load). Free cores of the total. Orange from 70%, red from 90%">CPU cores</th>
                            <th scope="col" title="Bar: share of memory in use. Free GB (available for new work) of the total. Orange from 70%, red from 90%">Memory</th>
                            <th scope="col" class="col-numeric" title="Local disk in use. Orange from 70%, red from 90%">Disk</th>
                            <th scope="col" title="VNC desktops and SSH terminals open (hover for how many are in use)">Sessions</th>
                            <th scope="col" class="col-center">Lab share</th>
                        </tr>
                    </thead>
                    <tbody id="fleet-body" aria-live="polite">
                        {% for i in range(6) %}
                        <tr><td colspan="6"><div class="skeleton" style="height: 18px;"></div></td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>

        <div class="board-side">
            <section class="board-panel" aria-labelledby="attention-heading">
                <header class="board-panel-head">
                    <h3 id="attention-heading">Needs attention</h3>
                    <span class="attention-counts" id="attention-counts" aria-live="polite"></span>
                </header>
                <div id="attention-list" aria-live="polite">
                    <div class="skeleton" style="height: 120px;"></div>
                </div>
            </section>

            <section class="board-panel" aria-labelledby="licenses-overview-heading">
                <header class="board-panel-head">
                    <h3 id="licenses-overview-heading">EDA licenses</h3>
                    <a class="board-link" href="{{ url_for('dashboard.user_activity', _anchor='licenses-heading') }}">All checkouts →</a>
                </header>
                <div id="overview-licenses" aria-live="polite">
                    <div class="skeleton" style="height: 90px;"></div>
                </div>
            </section>
        </div>
    </div>
</section>

<script>
document.querySelector('[data-tab="overview"]')?.addEventListener('click', function() {
    loadServerGrid();
});
</script>
