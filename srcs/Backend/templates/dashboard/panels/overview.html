<!-- Usage Overview Panel -->
<section class="overview-container" role="region" aria-labelledby="overview-heading">
    <header class="section-head">
        <div>
            <p class="kicker">Section 01</p>
            <h2 id="overview-heading">Usage Overview</h2>
            <p class="section-deck">Live resource load across every monitored server. Tick marks on each bar sit at the 70% warning and 90% critical thresholds.</p>
        </div>
    </header>

    <p class="lede" id="overview-lede" aria-live="polite"></p>

    <!-- Loading State - Skeleton Cards -->
    <div id="overview-loading" class="server-grid">
        {% for i in range(4) %}
        <div class="skeleton-card skeleton"></div>
        {% endfor %}
    </div>

    <!-- Server Grid -->
    <div id="server-grid" class="server-grid" hidden aria-label="Server cards grid"></div>

    <!-- Empty State -->
    <div id="overview-empty" class="empty-state" hidden role="status">
        <i class="fas fa-server" aria-hidden="true"></i>
        <h3>No servers available</h3>
        <p>No server data is currently available. Please check your connection.</p>
        <button class="btn btn-primary" onclick="loadServerGrid()" aria-label="Retry loading server data">
            <i class="fas fa-sync-alt" aria-hidden="true"></i> Retry
        </button>
    </div>
</section>

<script>
document.querySelector('[data-tab="overview"]')?.addEventListener('click', function() {
    loadServerGrid();
});
</script>
