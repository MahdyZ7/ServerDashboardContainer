<!-- Performance Analytics Panel -->
<section class="analytics-container" role="region" aria-labelledby="analytics-heading">
    <header class="section-head">
        <div>
            <p class="kicker">Section 04</p>
            <h2 id="analytics-heading">Performance Analytics</h2>
            <p class="section-deck">Historical metrics for one server at a time. Choose a machine and a time window.</p>
        </div>
    </header>

    <!-- Chart Controls -->
    <div class="chart-controls" role="toolbar" aria-label="Chart controls">
        <div class="server-selector">
            <label for="analytics-server">Server</label>
            <select id="analytics-server"></select>
        </div>

        <div class="time-range-selector">
            <label for="time-range">Time range</label>
            <select id="time-range">
                <option value="6">Last 6 hours</option>
                <option value="12">Last 12 hours</option>
                <option value="24" selected>Last 24 hours</option>
                <option value="72">Last 3 days</option>
                <option value="168">Last week</option>
            </select>
        </div>

        <button class="btn btn-secondary" id="refresh-charts" aria-label="Refresh charts">
            <i class="fas fa-sync-alt" aria-hidden="true"></i>
            <span>Refresh charts</span>
        </button>
    </div>

    <!-- Charts Grid -->
    <div class="charts-grid" aria-label="Performance charts">
        <figure class="chart-container">
            <figcaption class="chart-title">
                <span class="chart-num">Fig. 4.1</span>
                <div>
                    <div class="chart-title-text">CPU utilisation</div>
                    <div class="chart-title-sub">Usage % with 5-minute load average</div>
                </div>
            </figcaption>
            <div class="chart-wrapper">
                <canvas id="cpu-chart" aria-label="CPU utilisation chart"></canvas>
            </div>
        </figure>

        <figure class="chart-container">
            <figcaption class="chart-title">
                <span class="chart-num">Fig. 4.2</span>
                <div>
                    <div class="chart-title-text">Memory usage</div>
                    <div class="chart-title-sub">RAM consumption over time</div>
                </div>
            </figcaption>
            <div class="chart-wrapper">
                <canvas id="memory-chart" aria-label="Memory usage chart"></canvas>
            </div>
        </figure>

        <figure class="chart-container">
            <figcaption class="chart-title">
                <span class="chart-num">Fig. 4.3</span>
                <div>
                    <div class="chart-title-text">Disk usage</div>
                    <div class="chart-title-sub">Storage consumption trend</div>
                </div>
            </figcaption>
            <div class="chart-wrapper">
                <canvas id="disk-chart" aria-label="Disk usage chart"></canvas>
            </div>
        </figure>

        <figure class="chart-container">
            <figcaption class="chart-title">
                <span class="chart-num">Fig. 4.4</span>
                <div>
                    <div class="chart-title-text">Swap usage</div>
                    <div class="chart-title-sub">Virtual memory utilisation</div>
                </div>
            </figcaption>
            <div class="chart-wrapper">
                <canvas id="swap-chart" aria-label="Swap usage chart"></canvas>
            </div>
        </figure>

        <figure class="chart-container">
            <figcaption class="chart-title">
                <span class="chart-num">Fig. 4.5</span>
                <div>
                    <div class="chart-title-text">TCP connections</div>
                    <div class="chart-title-sub">Active connection count</div>
                </div>
            </figcaption>
            <div class="chart-wrapper">
                <canvas id="connections-chart" aria-label="TCP connections chart"></canvas>
            </div>
        </figure>

        <figure class="chart-container">
            <figcaption class="chart-title">
                <span class="chart-num">Fig. 4.6</span>
                <div>
                    <div class="chart-title-text">Network throughput</div>
                    <div class="chart-title-sub">Cumulative RX / TX in megabytes</div>
                </div>
            </figcaption>
            <div class="chart-wrapper">
                <canvas id="network-throughput-chart" aria-label="Network throughput chart"></canvas>
            </div>
        </figure>

        <figure class="chart-container">
            <figcaption class="chart-title">
                <span class="chart-num">Fig. 4.7</span>
                <div>
                    <div class="chart-title-text">Active users</div>
                    <div class="chart-title-sub">Logged-in sessions over time</div>
                </div>
            </figcaption>
            <div class="chart-wrapper">
                <canvas id="users-chart" aria-label="Active users chart"></canvas>
            </div>
        </figure>

        <figure class="chart-container chart-full-width chart-tall">
            <figcaption class="chart-title">
                <span class="chart-num">Fig. 4.8</span>
                <div>
                    <div class="chart-title-text">Combined metrics</div>
                    <div class="chart-title-sub">CPU load, memory and disk on shared axes</div>
                </div>
            </figcaption>
            <div class="chart-wrapper">
                <canvas id="combined-chart" aria-label="Combined metrics chart"></canvas>
            </div>
        </figure>
    </div>
</section>

<script>
document.querySelector('[data-tab="analytics"]')?.addEventListener('click', function() {
    loadPerformanceAnalytics();
});
</script>
