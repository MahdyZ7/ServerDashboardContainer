<!-- Network Monitor Panel -->
<section class="network-container" role="region" aria-labelledby="network-heading">
    <header class="section-head">
        <div>
            <p class="kicker">Section 05</p>
            <h2 id="network-heading">Network Monitor</h2>
            <p class="section-deck">TCP connection counts and cumulative interface traffic for each server.</p>
        </div>
    </header>

    <div id="network-overview" class="network-overview-grid" aria-label="Network overview statistics">
        {% for i in range(4) %}
        <div class="overview-stat skeleton"></div>
        {% endfor %}
    </div>

    <figure class="chart-container chart-full-width">
        <figcaption class="chart-title">
            <span class="chart-num">Fig. 5.1</span>
            <div>
                <div class="chart-title-text">Connections by server</div>
                <div class="chart-title-sub">Established TCP connections at the latest sample</div>
            </div>
        </figcaption>
        <div class="chart-wrapper"><canvas id="network-activity-chart" aria-label="Network connections chart"></canvas></div>
    </figure>

    <div class="network-details">
        <h3 class="section-title"><span class="kicker">05.1</span>Connection ledger</h3>
        <div id="server-connections" aria-label="Server connection details">
            <div class="skeleton-card skeleton" style="min-height: 200px;"></div>
        </div>
    </div>
</section>

<script>
document.querySelector('[data-tab="network"]')?.addEventListener('click', function() {
    loadNetworkMonitor();
});
</script>
