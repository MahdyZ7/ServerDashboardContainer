<!-- Server Details Panel -->
<section class="servers-container" role="region" aria-labelledby="servers-heading">
    <header class="section-head">
        <div>
            <p class="kicker">Section 02</p>
            <h2 id="servers-heading">Server Details</h2>
            <p class="section-deck">Fleet-wide figures, then a specification sheet for each machine.</p>
        </div>
    </header>

    <div id="system-overview" class="system-overview-grid" aria-label="System overview statistics">
        {% for i in range(6) %}
        <div class="overview-stat skeleton"></div>
        {% endfor %}
    </div>

    <h3 class="section-title"><span class="kicker">02.1</span>Machines</h3>

    <div id="enhanced-server-cards" class="enhanced-server-cards" aria-label="Detailed server cards">
        {% for i in range(2) %}
        <div class="skeleton-card skeleton" style="min-height: 360px;"></div>
        {% endfor %}
    </div>

    <!-- Per-machine detail: health, mounts, disks, network from the latest collection -->
    <section class="machine-detail" aria-labelledby="machine-detail-heading">
        <h3 class="section-title" id="machine-detail-heading"><span class="kicker">02.2</span>Machine detail</h3>
        <div class="table-controls">
            <div class="filter-group">
                <label for="machine-select">Server</label>
                <select id="machine-select" aria-controls="machine-detail-body"></select>
            </div>
            <span class="table-result-count" id="machine-collected" aria-live="polite"></span>
        </div>
        <div id="machine-detail-body" aria-live="polite">
            <p class="cell-muted">Loading…</p>
        </div>
    </section>
</section>

<script>
document.querySelector('[data-tab="servers"]')?.addEventListener('click', function() {
    loadSystemOverview();
    loadEnhancedServerCards();
});
</script>
